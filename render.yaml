# Render Blueprint — https://render.com/docs/blueprint-spec
#
# One service. Express serves the API on /api/* and hands everything else to
# Next, so the shop and the dashboard come from a single Node process.
#
# It was two services, which cost twice as much and existed for one reason: the
# auth cookie has to be same-origin. The API sets it and frontend/middleware.ts
# reads it back to guard /admin, and across two hosts the browser would never
# send it — hence the /api proxy. One origin makes that true by construction.
#
# The failure isolation given up is mostly illusory here: every storefront page
# render calls the API, so if the API is down the shop is broken either way.
#
# Secrets are `sync: false` so Render prompts for them instead of storing them
# in this file. Nothing here should ever hold a real value.

services:
  - type: web
    name: jules-and-co
    runtime: node
    plan: starter
    region: oregon
    branch: master

    # --include=dev is not optional. NODE_ENV=production makes npm omit
    # devDependencies — and typescript, tailwindcss, postcss and autoprefixer
    # all live there while being needed to *build*. Without the flag the very
    # first deploy fails on a missing TypeScript compiler.
    buildCommand: npm ci --include=dev && npm run build -w frontend
    startCommand: npm start -w backend

    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      # Pinned so a change to Render's default cannot move the runtime under
      # the app between deploys. Matches .node-version and the engines field.
      - key: NODE_VERSION
        value: 22.14.0

      # What makes this one service rather than two: server.js prepares Next
      # and mounts it behind the API routes.
      - key: SERVE_FRONTEND
        value: "true"

      # Relative, and now literally same-origin rather than proxied.
      - key: NEXT_PUBLIC_API_URL
        value: /api

      # Render injects PORT; backend/server.js reads it, and sets API_ORIGIN to
      # its own loopback address so server components can reach the API.

      - key: MONGO_URI
        sync: false

      # Signs the admin cookie, and verified by frontend/middleware.ts. One
      # service means one value — the two can no longer drift apart, which was
      # the single most costly misconfiguration in the two-service shape.
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 30d

      # Atlas M0 has no automated backups, so the API takes a daily one and
      # stores it in Cloudinary as an authenticated (non-public) raw file.
      # The dumps carry customer names, emails, phones and addresses.
      - key: BACKUP_ENABLED
        value: "true"
      - key: BACKUP_HOUR
        value: "3"
      - key: BACKUP_KEEP
        value: "14"

      # Paystack. The secret key signs webhooks and initialises transactions and
      # must never reach a browser; the public key is designed to be public.
      # Use sk_test_/pk_test_ until you are ready to take real money — both keys
      # must be from the same mode or Paystack rejects the pair.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false

      # Transactional order email, via Resend. Without RESEND_API_KEY the shop
      # works exactly as it does now and simply tells nobody anything — every
      # send reports the missing key rather than failing an order.
      #
      # MAIL_FROM must be an address at a domain verified in Resend. Leave it
      # unset and mail goes out as onboarding@resend.dev, which works
      # immediately and is fine for testing, but is not what a customer should
      # see a receipt come from.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Read only when the admin user is *created*. Changing it later does
      # nothing on its own — use Settings → Administrators, or
      # `npm run set-admin-password -w backend`.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # CLIENT_URL is optional here, and only needed once a custom domain is in
      # front of this service.
      #
      # It no longer feeds only CORS — CORS is moot with one origin. It is now
      # also where Paystack sends a customer back to after paying. Unset,
      # backend/src/controllers/paymentController.js falls back to Render's own
      # RENDER_EXTERNAL_URL, so the .onrender.com deployment works untouched.
      # Point it at the real domain once you have one, or paying customers are
      # returned to the onrender.com address instead of your shop.
      # - key: CLIENT_URL
      #   value: https://your-domain.com
